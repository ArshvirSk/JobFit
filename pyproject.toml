[project]
name = "jobfit"
version = "0.1.0"
description = "AI Job Application Copilot — tailored resumes, cover letters, and skill-gap analysis in seconds"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Data validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # LLM & Pipeline
    "langgraph>=0.2.0",
    "langchain-core>=0.2.30",
    # Resume parsing
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    # JD fetching
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "google-genai>=2.17.0",
    "supabase>=2.31.0",
    "stripe>=15.5.0",
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "httpx",  # for FastAPI TestClient
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests that call real LLM APIs (deselect with '-m \"not live\"')",
]
